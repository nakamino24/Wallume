name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: yarn lint
      - run: yarn test --runInBand

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # Deterministic tier: no network, no database.
      - run: pytest

  backend-integration:
    # Real MongoDB, because atomicity, rollback, concurrency and tenancy
    # re-scoping cannot be verified with mocks. A service container is a
    # single-node replica set, which is what multi-document transactions need.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --name mongo
        command: --replSet rs0 --bind_ip_all
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Initiate replica set
        run: |
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok"
      - name: Wait for primary
        run: |
          for i in $(seq 1 30); do
            state=$(docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary")
            [ "$state" = "true" ] && echo "primary ready" && exit 0
            sleep 2
          done
          echo "replica set did not become primary" && exit 1
      - run: pytest --run-integration
        env:
          MONGO_URL: mongodb://localhost:27017/?directConnection=true
